<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--ink:#1c2333;--muted:#5d6780;--line:#dfe3ee;
  --brand:#1f5fbf;--brand2:#0f3d82;--accent:#e8912d;--ok:#1b9a5b;--bad:#d24545;

}
:root[data-theme=dark]{
  --bg:#12151e;--panel:#1b2030;--ink:#e6e9f2;--muted:#9aa4bd;--line:#2c3348;
  --brand:#6ea3ff;--brand2:#9dc1ff;--accent:#f0a850;--shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.65 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--brand)}
#app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 14px}
aside h1{font-size:18px;margin:0 0 2px;color:var(--brand2)}
aside .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.chap{margin:6px 0}
.chap>button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font:600 14px inherit;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.chap>button:hover{background:var(--bg)}
.chap.open>button{background:var(--bg)}
.chap .num{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.sec{display:none;margin:2px 0 6px 18px;border-left:2px solid var(--line)}
.chap.open .sec{display:block}
.sec a{display:flex;justify-content:space-between;padding:4px 10px;font-size:13px;color:var(--muted);text-decoration:none;border-radius:6px}
.sec a:hover{background:var(--bg);color:var(--ink)}
.sec a.active{color:var(--brand);font-weight:600;background:var(--bg)}
.sec a .tick{color:var(--ok)}
.tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tools button,.btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer;font:13px inherit}
.tools button:hover,.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding:28px min(5vw,56px) 80px;max-width:1080px;width:100%}
.topbar{display:none}
.hero{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:16px;padding:28px;margin-bottom:22px}
.hero h2{margin:0 0 6px;font-size:26px}
.hero p{margin:0;opacity:.92}
.hero .pill{display:inline-block;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:99px;font-size:12px;margin-bottom:8px}
h2.st{font-size:24px;margin:0 0 4px;color:var(--brand2)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}

.card h3{margin:0 0 8px;font-size:17px}
.card h4{margin:14px 0 6px;font-size:15px}
.note,.warn,.key,.check{border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15px;border-left:5px solid}
.note{background:rgba(31,95,191,.08);border-color:var(--brand)}
.key{background:rgba(232,145,45,.12);border-color:var(--accent)}
.warn{background:rgba(210,69,69,.09);border-color:var(--bad)}
.check{background:rgba(27,154,91,.1);border-color:var(--ok)}
.note b:first-child,.key b:first-child,.warn b:first-child,.check b:first-child{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:rgba(31,95,191,.1)}
.tw{overflow-x:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.mini h4{margin:0 0 4px}
.mini.click{cursor:pointer;transition:.15s}
.mini.click:hover,.mini.sel{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow)}
.lab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:14px}
.lab input[type=range]{flex:1;min-width:140px}
.lab select,.lab input[type=number],.lab input[type=text]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.val{font-weight:700;color:var(--brand);min-width:52px}
canvas,svg.w{max-width:100%;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:2px 3px 2px 0}
.tag.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#6ea3ff)}
.tl{position:relative;margin:14px 0 6px;padding-left:20px;border-left:3px solid var(--brand)}
.tl .ev{position:relative;margin:0 0 12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tl .ev:before{content:"";position:absolute;left:-30px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--brand)}
.tl .ev.open{border-color:var(--brand)}
.tl .ev .d{display:none;color:var(--muted);font-size:14px;margin-top:4px}
.tl .ev.open .d{display:block}
.tl .ev b{color:var(--brand2)}
.pager{display:flex;justify-content:space-between;margin-top:30px;gap:10px}
.mtab{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.mtab button{padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;cursor:pointer;font:13px inherit}
.mtab button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
sub,sup{line-height:0}
.ov{text-decoration:overline}
.res{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:middle;border:1px solid var(--line)}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:-310px;width:290px;z-index:20;transition:.2s;box-shadow:var(--shadow)}

  .topbar{display:flex;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;gap:10px;align-items:center}
  .two{grid-template-columns:1fr}
}

 sections:[
 {id:'gioi-thieu', title:'1. Giới thiệu học phần', html:`
 <div class="card"><h3>Thông tin học phần</h3>
 <div class="tw"><table><tr><th>Mã học phần</th><td>GE2079 – Khoáng vật và Thạch học (<i>Mineralogy and Petrology</i>)</td></tr>
 <tr><th>Số tín chỉ</th><td>3 (30 tiết lý thuyết + 30 tiết thực tập tại CS1 – P.202B8, theo thời khoá biểu)</td></tr>
 <tr><th>Giảng viên</th><td>Đổng Uyên Thanh – Khoa Kỹ thuật Địa chất và Dầu khí (khoáng vật, thạch học, địa chất môi trường; xử lý môi trường đất, nước, khoáng hoá CO₂)</td></tr>
 <tr><th>Giáo trình</th><td>[1] <i>Khoáng vật học</i> – La Thị Chích, NXB ĐHQG TP.HCM<br>[2] <i>Thạch học</i> – La Thị Chích, NXB ĐHQG TP.HCM</td></tr></table></div></div>

 <div class="card"><h3>Cấu trúc 8 chương</h3>
 <div class="tw"><table><tr><th>Chương</th><th>Nội dung chính</th></tr>
 <tr><td>1. Tổng quan</td><td>Đề cương; định nghĩa và vai trò của khoáng vật học, thạch học; lịch sử phát triển</td></tr>
 <tr><td>2. Tinh thể học</td><td>Cấu trúc chất rắn; liên kết hoá học; các hệ tinh thể; đối xứng; quan hệ cấu trúc – tính chất</td></tr>
 <tr><td>3. Khoáng vật học</td><td>Thành phần hoá học; tính chất vật lý; tính chất quang học cơ bản; hình thành – biến đổi; phân loại; khoáng vật phổ biến</td></tr>
 <tr><td>4. Đá magma</td><td>Nguồn gốc magma; kết tinh; thành phần; kiến trúc, cấu tạo; phân loại; các đá phổ biến</td></tr>
 <tr><td>5. Đá trầm tích</td><td>Quá trình hình thành; phân loại; kiến trúc, cấu tạo; môi trường trầm tích; các đá phổ biến</td></tr>
 <tr><td>6. Đá biến chất</td><td>Yếu tố và kiểu biến chất; kiến trúc, cấu tạo; khoáng vật chỉ thị; tướng biến chất; các đá phổ biến</td></tr>
 <tr><td>7. Phương pháp nghiên cứu</td><td>Kính hiển vi phân cực; nhiễu xạ tia X (XRD); phân tích thành phần hoá học</td></tr>
 <tr><td>8. Đá quý và khoáng sản</td><td>Đá quý; khoáng sản công nghiệp; ứng dụng; giá trị kinh tế và phát triển bền vững</td></tr></table></div>
 <p>Ngoài ra có <b>bài tập ứng dụng</b> (tổng hợp, vận dụng và trình bày kết quả).</p></div>

 <div class="card"><h3>Lịch thực hành (tuần 8 → 13)</h3>
 <div class="tw"><table><tr><th>Tuần</th><th>Bài</th><th>Trọng tâm</th><th>CĐR</th></tr>
 <tr><td>8</td><td>TH1. Tính đối xứng của tinh thể</td><td>Nhận biết, thực hành các yếu tố và phép đối xứng</td><td>L.O.2.1, 3.1</td></tr>
 <tr><td>9</td><td>TH2. Hình thái và tính chất khoáng vật</td><td>Quan sát hình thái, xác định tính chất đặc trưng, nhận dạng</td><td>L.O.2.1</td></tr>
 <tr><td>10</td><td>TH3. Kính hiển vi phân cực</td><td>Làm quen kính, quan sát đặc điểm khoáng vật dưới kính</td><td>L.O.2.1</td></tr>
 <tr><td>11</td><td>TH4. Đá magma</td><td>Quan sát, mô tả, nhận dạng từ mẫu thực hành</td><td>L.O.2.1</td></tr>
 <tr><td>12</td><td>TH5. Đá trầm tích và đá biến chất</td><td>Quan sát, mô tả, phân biệt, nhận dạng</td><td>L.O.2.1</td></tr>
 <tr><td>13</td><td>Thi thực hành</td><td>Kiểm tra kỹ năng quan sát và nhận dạng mẫu</td><td>L.O.2.1</td></tr></table></div></div>

 <div class="card"><h3>Chuẩn đầu ra (CĐR) – bạn cần đạt gì?</h3>
 <div class="tw"><table><tr><th>CĐR</th><th>Nội dung</th><th>Đánh giá qua</th></tr>
 <tr><td>L.O.1.1</td><td>Mô tả và phân loại các nhóm khoáng vật, đá dựa trên thành phần hoá học, cấu trúc tinh thể, tính chất vật lý</td><td>Thi cuối kỳ, quá trình</td></tr>
 <tr><td>L.O.1.2</td><td>So sánh, giải thích khác biệt giữa khoáng vật, đá magma, đá trầm tích và đá biến chất</td><td>Thi cuối kỳ, quá trình</td></tr>
 <tr><td>L.O.2.1</td><td>Quan sát, nhận dạng, trình bày đặc điểm khoáng vật và đá từ mẫu cầm tay và lát mỏng</td><td>Thực hành, quá trình</td></tr>
 <tr><td>L.O.2.2</td><td>Diễn giải và áp dụng kết quả kính hiển vi, XRD, phân tích hoá học vào tình huống thực tế</td><td>Thi cuối kỳ, bài tập ứng dụng, quá trình</td></tr>
 <tr><td>L.O.3.1</td><td>Tuân thủ quy định an toàn, quy trình thực hành, chuẩn mực học thuật</td><td>Thực hành, quá trình</td></tr>
 <tr><td>L.O.3.2</td><td>Phối hợp làm việc nhóm, trình bày kết quả học tập và thực hành</td><td>Bài tập ứng dụng, quá trình</td></tr></table></div></div>

 <div class="card"><h3>Cơ cấu điểm – tính thử điểm của bạn</h3><div data-w="grading"></div>
 <div class="note"><b>Hình thức thi cuối kỳ</b>Trắc nghiệm 50 câu MCQ / 60 phút. Thi thực hành tại Phòng thí nghiệm Thạch học: quan sát, mô tả, nhận dạng khoáng vật và đá từ mẫu cầm tay và lát mỏng dưới kính hiển vi.</div></div>`},

 {id:'la-gi', title:'2. Khoáng vật học và thạch học là gì?', html:`
 <p>Hai ngành này là “hai mặt của một đồng xu”: một bên nghiên cứu <b>viên gạch</b> (khoáng vật), một bên nghiên cứu <b>ngôi nhà</b> (đá).</p>
 <div class="two">
  <div class="card" style="border-top:5px solid var(--c1)"><h3>Khoáng vật học</h3><p>Ngành khoa học nghiên cứu <b>khoáng vật</b> – những thành phần cơ bản cấu tạo nên đá.</p>
   <b>Nội dung nghiên cứu:</b><ul><li>Thành phần hoá học</li><li>Cấu trúc tinh thể</li><li>Hình thái và tính chất vật lý</li><li>Nguồn gốc và điều kiện hình thành</li><li>Phân loại và ứng dụng</li></ul>
   <b>Đối tượng:</b> thạch anh, feldspar, calcite, mica…</div>
  <div class="card" style="border-top:5px solid var(--c2)"><h3>Thạch học</h3><p>Ngành khoa học nghiên cứu <b>đá</b> – vật liệu tự nhiên cấu tạo nên vỏ Trái Đất.</p>
   <b>Nội dung nghiên cứu:</b><ul><li>Thành phần khoáng vật và hoá học</li><li>Kiến trúc và cấu tạo</li><li>Nguồn gốc và quá trình hình thành</li><li>Phân loại các nhóm đá</li><li>Sự biến đổi và ứng dụng</li></ul>
   <b>Đối tượng:</b> đá magma, đá trầm tích, đá biến chất</div></div>
 <div class="card"><h3>Mối liên hệ – bấm từng mũi tên để hiểu “suy luận địa chất”</h3><div data-w="chain"></div></div>
 <div class="key"><b>Ghi nhớ</b>Khoáng vật → đá → lịch sử địa chất. Nhận dạng khoáng vật là cơ sở để phân loại đá và giải thích nguồn gốc của nó.</div>
 <div class="note"><b>Mở rộng – định nghĩa “khoáng vật”</b>Theo cách hiểu chung của khoa học: khoáng vật là chất rắn tự nhiên, thành phần hoá học tương đối xác định, có cấu trúc tinh thể trật tự, thường được hình thành bởi các quá trình địa chất. Điều này nối trực tiếp sang Chương 2 (Tinh thể học).</div>`},

 {id:'vai-tro', title:'3. Vai trò và ứng dụng', html:`
 <h3>Sáu vai trò chính</h3>
 <div class="grid">
  <div class="mini"><h4>🌍 Hiểu thành phần Trái Đất</h4>Khoáng vật và đá là vật liệu cơ bản cấu tạo nên vỏ Trái Đất.</div>
  <div class="mini"><h4>⚙ Giải thích quá trình địa chất</h4>Thành phần, kiến trúc, cấu tạo của đá phản ánh điều kiện và quá trình hình thành chúng.</div>
  <div class="mini"><h4>⏳ Tái lập lịch sử địa chất</h4>Lưu giữ bằng chứng về hoạt động magma, trầm tích, biến chất và kiến tạo trong quá khứ.</div>
  <div class="mini"><h4>🔍 Nhận dạng và phân loại</h4>Dùng tính chất vật lý, hoá học, quang học để xác định, so sánh, phân loại khoáng vật và đá.</div>
  <div class="mini"><h4>⛏ Đánh giá tài nguyên</h4>Cơ sở cho tìm kiếm, thăm dò và đánh giá khoáng sản.</div>
  <div class="mini"><h4>♻ Phát triển bền vững</h4>Giúp khai thác, sử dụng tài nguyên hiệu quả và giảm tác động môi trường.</div></div>
 <h3>Ứng dụng theo lĩnh vực – bấm lọc</h3><div data-w="apps"></div>`},

 {id:'lich-su', title:'4. Lịch sử phát triển', html:`
 <p>Bấm vào từng mốc để xem ý nghĩa. Sáu giai đoạn cho thấy môn học đi từ <b>mô tả</b> → <b>hình học</b> → <b>phân loại</b> → <b>kính hiển vi</b> → <b>cấu trúc nguyên tử</b> → <b>định lượng, liên ngành</b>.</p>
 <div data-w="timeline"></div>
 <div class="key"><b>Ghi nhớ nhanh (dễ ra thi)</b><ul style="margin:4px 0 0"><li>Haüy – cấu trúc có trật tự bên trong tinh thể (XVII–XVIII).</li><li>Mohs – thang độ cứng; Dana – hệ thống phân loại (đầu–giữa XIX).</li><li>Sorby – lát mỏng + ánh sáng phân cực (giữa–cuối XIX).</li><li>Nhiễu xạ tia X 1912; W.H. Bragg &amp; W.L. Bragg – xác định cấu trúc tinh thể.</li><li>XRD, XRF, SEM–EDS, Raman, đồng vị, mô hình hoá – hiện đại (XX–XXI).</li></ul></div>`},

 {id:'thao-luan', title:'5. Thảo luận và tổng kết', html:`
 <p>Chín câu hỏi đặt vấn đề của giảng viên. Hãy tự trả lời trước, rồi bấm để xem gợi ý.</p><div data-w="discuss"></div>

window.CHAPTERS.push({
 id:'c2', num:2, title:'Tinh thể học',
 blurb:'Chất rắn kết tinh, mạng và ô mạng, 7 hệ – 14 mạng Bravais, đối xứng, chỉ số Miller, hình đơn – hình ghép, cấu trúc → tính chất.',
 sections:[
 {id:'ket-tinh', title:'1. Chất rắn kết tinh – từ cấu trúc đến hình dạng', html:`
 <p><b>Câu hỏi đặt ra:</b> Tại sao khoáng vật lại có những hình dạng đặc trưng? Vì hình dạng bên ngoài là “dấu vân tay” của <b>cấu trúc bên trong</b>: halite (NaCl) → khối lập phương; thạch anh (SiO₂) → lăng trụ sáu phương; calcite (CaCO₃) → mặt thoi (hệ ba phương); pyrite (FeS₂) → khối lập phương (hệ lập phương).</p>
 <div class="key"><b>Định nghĩa</b>Tinh thể là chất rắn có các nguyên tử / ion / phân tử được sắp xếp <b>có trật tự và tuần hoàn</b> trong không gian ba chiều.</div>
 <div class="card"><h3>So sánh chất rắn kết tinh và vô định hình</h3>
 <div class="tw"><table><tr><th></th><th>Chất rắn kết tinh (tinh thể)</th><th>Chất rắn vô định hình</th></tr>
 <tr><td>Sắp xếp hạt</td><td>Trật tự, tuần hoàn xa (trật tự xa) trong không gian 3D</td><td>Không có trật tự xa, không tuần hoàn</td></tr>
 <tr><td>Mạng tinh thể</td><td>Có mạng tinh thể xác định</td><td>Không có</td></tr>
 <tr><td>Hình dạng</td><td>Khi phát triển thuận lợi → có mặt phẳng, hình dạng đặc trưng</td><td>Không có mặt phẳng hay hình dạng đặc trưng</td></tr>
 <tr><td>Nhiễu xạ tia X (XRD)</td><td>Đỉnh nhiễu xạ sắc, hẹp</td><td>Dải rộng, không có đỉnh sắc nét</td></tr>
 <tr><td>Ví dụ</td><td>Thạch anh (SiO₂)</td><td>Obsidian (thuỷ tinh núi lửa)</td></tr></table></div>
 <div data-w="order"></div></div>
 <div class="key"><b>Ghi nhớ</b>Trật tự và tuần hoàn trong cấu trúc chính là điểm cốt lõi giúp phân biệt chất rắn <b>kết tinh</b> với chất rắn <b>vô định hình</b>. XRD là phép thử phân biệt “quyết định”.</div>
 <div class="note"><b>Cùng thành phần – khác tính chất?</b> Kim cương và than chì đều là carbon nhưng một loại cứng nhất, một loại mềm gần nhất. Lý do nằm ở cấu trúc – bạn sẽ tự khám phá ở mục 9 của chương này.</div>`},

 {id:'mang', title:'2. Cấu trúc tuần hoàn: nút mạng, cơ sở, ô mạng', html:`
 <p>Để mô tả một tinh thể chỉ cần biết hai thứ: <b>“khuôn” lặp lại</b> (mạng) và <b>“vật” đặt vào khuôn</b> (cơ sở).</p>
 <div class="grid">
  <div class="mini"><h4>🔵 Nút mạng (lattice point)</h4>Vị trí lý tưởng trong mạng, gắn với một nhóm nguyên tử / ion hoặc không có nguyên tử.</div>
  <div class="mini"><h4>🕸 Mạng tinh thể (lattice)</h4>Tập hợp vô hạn các nút mạng sắp xếp tuần hoàn trong không gian.</div>
  <div class="mini"><h4>⚛ Cơ sở (basis)</h4>Nhóm một hoặc nhiều nguyên tử / ion gắn vào mỗi nút mạng.</div></div>
 <div class="key"><b>Công thức cốt lõi</b>Cấu trúc tinh thể = <b>Mạng tinh thể + Cơ sở</b>. Chỉ cần biết mạng cơ sở và cơ sở là mô tả được toàn bộ cấu trúc.</div>
 <div class="card"><h3>Thử ngay: dựng mạng 2D từ ô cơ sở</h3><div data-w="lattice2d"></div></div>
 <div class="card"><h3>Ví dụ: Halite (NaCl)</h3><ul><li>Hệ lập phương, mạng <b>F</b> (lập phương tâm mặt – FCC).</li><li>Cơ sở gồm 2 ion: Cl⁻ và Na⁺ đặt theo phương chéo khối.</li><li>Công thức: NaCl. Sự lặp lại của cơ sở ở mọi nút mạng tạo nên cấu trúc halite.</li></ul></div>
 <div class="card"><h3>Ô mạng cơ sở (unit cell)</h3><p>Đơn vị nhỏ nhất của mạng tinh thể, lặp lại tuần hoàn trong không gian tạo nên cấu trúc. Một ô mạng bao gồm vị trí các nút mạng và (nếu có) các nguyên tử/ion thuộc cơ sở nằm trong ô. Ô mạng giống như viên gạch – lặp lại theo ba trục a, b, c để xây nên cả tinh thể.</p>
 <div class="note"><b>Ghi nhớ</b>Mỗi mạng tinh thể được mô tả đầy đủ nếu biết: <b>ô mạng + cơ sở + thông số mạng (a, b, c; α, β, γ)</b>. Nhiều ô mạng khác nhau có thể biểu diễn cùng một mạng, nhưng ta thường chọn ô đơn giản nhất.</div></div>`},

 {id:'he-tinh-the', title:'3. Thông số mạng và 7 hệ tinh thể', html:`
 <p>Ô mạng có <b>6 thông số</b>: ba cạnh <b>a, b, c</b> và ba góc <b>α, β, γ</b>.</p>
 <div class="grid">
  <div class="mini"><h4>Ba cạnh</h4>a: dọc trục x · b: dọc trục y · c: dọc trục z (chiều dài cạnh ô mạng).</div>
  <div class="mini"><h4>Ba góc</h4>α: giữa trục b và c · β: giữa trục a và c · γ: giữa trục a và b (0° &lt; α, β, γ &lt; 180°).</div></div>
  <div class="key"><b>Ý nghĩa</b>Thông số mạng là “địa chỉ” của ô mạng và là cơ sở để xác định hệ tinh thể, kiểu mạng Bravais và nhiều tính chất của tinh thể.</div>
 <div class="card"><h3>Phòng thí nghiệm: kéo thông số, xem hệ tinh thể tự đổi</h3>
 <p style="margin-top:0">Kéo chuột trên hình để xoay. Chọn nhanh một hệ hoặc tự chỉnh 6 thông số; web sẽ nhận diện hệ tinh thể.</p>
 <div data-w="cell3d" data-mode="params"></div></div>
 <div class="card"><h3>Bảng 7 hệ tinh thể</h3><div class="tw"><table>
 <tr><th>Hệ</th><th>Cạnh</th><th>Góc</th><th>Ví dụ khoáng vật</th></tr>
 <tr><td>1. Lập phương (cubic)</td><td>a = b = c</td><td>α = β = γ = 90°</td><td>Halite (NaCl), pyrite (FeS₂)</td></tr>
 <tr><td>2. Tứ phương (tetragonal)</td><td>a = b ≠ c</td><td>α = β = γ = 90°</td><td>Zircon (ZrSiO₄), rutile (TiO₂)</td></tr>
 <tr><td>3. Trực thoi (orthorhombic)</td><td>a ≠ b ≠ c</td><td>α = β = γ = 90°</td><td>Olivine (Mg,Fe)₂SiO₄, topaz</td></tr>
 <tr><td>4. Ba phương (trigonal)</td><td>a = b = c</td><td>α = β = γ ≠ 90° (ô thoi)</td><td>Calcite (CaCO₃), quartz (SiO₂)*</td></tr>
 <tr><td>5. Sáu phương (hexagonal)</td><td>a = b ≠ c</td><td>α = β = 90°, γ = 120°</td><td>Beryl, graphite (C)</td></tr>
 <tr><td>6. Một nghiêng (monoclinic)</td><td>a ≠ b ≠ c</td><td>α = γ = 90°, β ≠ 90°</td><td>Gypsum, muscovite, orthoclase</td></tr>
 <tr><td>7. Ba nghiêng (triclinic)</td><td>a ≠ b ≠ c</td><td>α ≠ β ≠ γ ≠ 90°</td><td>Albite, microcline</td></tr></table></div>
 <p style="font-size:14px;color:var(--muted)">* Thạch anh α thuộc nhóm điểm 32 (ba phương) nhưng ô mạng có dạng lục giác nên hình dạng trông “sáu phương”. Điều này cho thấy <b>hệ tinh thể xác định bằng đối xứng chứ không chỉ bằng thông số mạng</b>; thông số mạng chỉ là bước đầu tiên để dự đoán.</p></div>
 <div class="warn"><b>Chú ý khi làm bài</b>Chỉ cần biết 6 thông số (a, b, c, α, β, γ) là có thể xác định được 1 trong 7 hệ tinh thể. Nhưng đảo lại thì không: ví dụ có thể có ô mạng “trông như” lập phương nhưng đối xứng thực thấp hơn.</div>`},

 {id:'lien-ket', title:'4. Liên kết hoá học và phối trí', html:`
 <p>Các nguyên tử / ion trong tinh thể được giữ với nhau bằng liên kết hoá học – <b>kiểu liên kết và độ mạnh liên kết chi phối cấu trúc tinh thể</b> và các tính chất vật lý của khoáng vật.</p>
 <div class="tw"><table><tr><th>Liên kết</th><th>Bản chất</th><th>Ví dụ</th><th>Đặc điểm</th></tr>
 <tr><td>1. Cộng hoá trị</td><td>Các nguyên tử chia sẻ cặp electron</td><td>Kim cương (C), thạch anh (SiO₂)</td><td>Rất mạnh, định hướng; nhiệt độ nóng chảy cao; cứng, giòn</td></tr>
 <tr><td>2. Ion</td><td>Lực hút tĩnh điện giữa cation và anion</td><td>Halite (NaCl), fluorite (CaF₂)</td><td>Mạnh, định hướng ít; nóng chảy khá cao; cứng, giòn</td></tr>
 <tr><td>3. Kim loại</td><td>Cation kim loại nằm trong “biển electron” tự do</td><td>Đồng (Cu), sắt tự nhiên (Fe)</td><td>Trung bình – mạnh; dẫn điện, dẫn nhiệt tốt; dẻo, dát mỏng</td></tr>
 <tr><td>4. Hydrogen</td><td>Lực hút giữa H (δ⁺) gần với nguyên tử âm điện và nguyên tử âm điện khác</td><td>Băng (H₂O), khoáng vật nhóm OH</td><td>Yếu – trung bình; ảnh hưởng nhiệt độ nóng chảy, độ bền</td></tr>
 <tr><td>5. Van der Waals</td><td>Lực hút yếu giữa các lưỡng cực tức thời</td><td>Graphite (giữa các lớp)</td><td>Rất yếu; mềm, tách lớp dễ dàng</td></tr></table></div>
 <div class="note"><b>Nhiều kiểu liên kết cùng lúc</b>Calcite có liên kết cộng hoá trị C–O trong nhóm CO₃²⁻ và tương tác ion giữa Ca²⁺ với CO₃²⁻. Graphite: cộng hoá trị trong lớp + Van der Waals giữa lớp. Mỗi khoáng vật thường có một loại liên kết chiếm ưu thế, các loại khác đóng vai trò bổ sung.</div>
 <h3>Phối trí</h3>
 <p><b>Số phối trí (CN)</b> là số nguyên tử/ion lân cận gần nhất bao quanh một nguyên tử/ion trung tâm. Nó quyết định hình học đơn vị cấu trúc cơ bản (đa diện phối trí), từ đó ảnh hưởng đến liên kết hoá học và tính chất vật lý. Bấm từng kiểu:</p>
 <div data-w="coord"></div>
 <div class="key"><b>Ghi nhớ</b>Mỗi nguyên tử/ion trung tâm có một số phối trí xác định, tạo hình học đặc trưng cho đơn vị cấu trúc. Các đơn vị cấu trúc (tứ diện, bát diện…) liên kết với nhau tạo nên mạng tinh thể khoáng vật.</div>`},

 {id:'bravais', title:'5. 14 kiểu mạng Bravais', html:`
 <p>Ô mạng cơ sở Bravais là ô nhỏ nhất lặp lại trong không gian ba chiều để tạo nên mạng tinh thể; nó phản ánh đầy đủ đối xứng của tinh thể. Có <b>14 kiểu</b> tương ứng với 7 hệ tinh thể. Mỗi hệ chỉ cho phép những kiểu ô nhất định:</p>
 <div class="tw"><table><tr><th>Hệ</th><th>Kiểu mạng</th><th>Số kiểu</th></tr>
 <tr><td>Lập phương</td><td>P, I, F</td><td>3</td></tr><tr><td>Tứ phương</td><td>P, I</td><td>2</td></tr><tr><td>Trực thoi</td><td>P, C, I, F</td><td>4</td></tr>
 <tr><td>Ba phương</td><td>R</td><td>1</td></tr><tr><td>Sáu phương</td><td>P</td><td>1</td></tr><tr><td>Một nghiêng</td><td>P, C</td><td>2</td></tr><tr><td>Ba nghiêng</td><td>P</td><td>1</td></tr>
 <tr><th>Tổng</th><th></th><th>14</th></tr></table></div>
  <div class="key"><b>Ký hiệu</b>P = nguyên thuỷ (Primitive, 1 nút/ô) · I = tâm khối (Body-centered, 2 nút/ô) · F = tâm mặt (Face-centered, 4 nút/ô) · C = tâm đáy (Base-centered, 2 nút/ô) · R = thoi lục giác (Rhombohedral, 1 nút/ô).</div>
 <div class="card"><h3>Khám phá 14 mạng Bravais</h3><div data-w="cell3d" data-mode="bravais"></div></div>`},

 {id:'doi-xung', title:'6. Đối xứng tinh thể và 32 lớp đối xứng', html:`
 <div class="key"><b>Định nghĩa</b>Tinh thể có tính đối xứng khi thực hiện các phép đối xứng nhất định thì hình dạng và cấu trúc của tinh thể không thay đổi. Đối xứng xuất hiện vì cấu trúc <b>trật tự và tuần hoàn</b>, và là cơ sở để hiểu hình dạng và tính chất khoáng vật.</div>
 <h3>Các yếu tố đối xứng</h3>
 <div class="grid">
  <div class="mini"><h4>1. Trục đối xứng (n)</h4>Quay quanh trục một góc 360°/n thì tinh thể lặp lại vị trí ban đầu.</div>
  <div class="mini"><h4>2. Mặt đối xứng (m)</h4>Mặt phẳng chia vật thể thành hai phần đối xứng như gương.</div>
  <div class="mini"><h4>3. Tâm đối xứng (i)</h4>Điểm sao cho mọi điểm A có điểm tương ứng A' đối diện qua tâm.</div>
  <div class="mini"><h4>4. Trục xoắn (nₛ)</h4>Kết hợp quay quanh trục và tịnh tiến theo trục (tuần hoàn – có trong cấu trúc, không có ở hình dạng ngoài).</div>
  <div class="mini"><h4>5. Mặt trượt</h4>Phản xạ qua mặt phẳng kết hợp với tịnh tiến song song với mặt đó.</div></div>
 <h3>Trục đối xứng và bậc n</h3>
 <div class="card"><div data-w="symaxis"></div></div>
 <div class="key"><b>Ghi nhớ</b>Bậc trục (n) càng cao → tính đối xứng càng lớn. Trong tinh thể chỉ có các bậc <b>1, 2, 3, 4 và 6</b>. Ví dụ: thạch anh – trục 3 (dọc c); halite – trục 4, 3 và 2; zircon – trục 4; beryl – trục 6.</div>
 <h3>32 lớp đối xứng theo 7 hệ tinh thể</h3>
 <p>Lớp đối xứng (nhóm điểm) là tập hợp các yếu tố đối xứng có thể có của một tinh thể, kết hợp lại. Có <b>32 lớp</b>. Ký hiệu Hermann–Mauguin: <b>n</b> trục bậc n; <b>n̄</b> trục nghịch đảo (trục n kết hợp tâm đối xứng); <b>m</b> mặt đối xứng; <b>n/m</b> trục n vuông góc mặt đối xứng; “<b>mm2, 422, …</b>” tổ hợp nhiều yếu tố; <b>1̄</b> = tâm đối xứng.</p>
 <div class="tw"><table>
 <tr><th>Hạng</th><th>Hệ</th><th>Số lớp</th><th>Các lớp (Hermann–Mauguin)</th><th>Ví dụ</th></tr>
 <tr><td rowspan="3">Thấp</td><td>Ba nghiêng</td><td>2</td><td>1, <span class="ov">1</span></td><td>Albite, microcline</td></tr>
 <tr><td>Một nghiêng</td><td>3</td><td>2, m, 2/m</td><td>Gypsum, muscovite, orthoclase</td></tr>
 <tr><td>Trực thoi</td><td>3</td><td>222, mm2, mmm</td><td>Olivine, topaz</td></tr>
 <tr><td rowspan="3">Trung</td><td>Tứ phương</td><td>7</td><td>4, <span class="ov">4</span>, 4/m, 422, 4mm, <span class="ov">4</span>2m, 4/mmm</td><td>Zircon, rutile</td></tr>
 <tr><td>Ba phương</td><td>5</td><td>3, <span class="ov">3</span>, 32, 3m, <span class="ov">3</span>m</td><td>Calcite (<span class="ov">3</span>m), thạch anh α (32), tourmaline (3m)</td></tr>
 <tr><td>Sáu phương</td><td>7</td><td>6, <span class="ov">6</span>, 6/m, 622, 6mm, <span class="ov">6</span>m2, 6/mmm</td><td>Beryl (6/mmm), graphite (6/mmm), apatite (6/m)</td></tr>
 <tr><td>Cao</td><td>Lập phương</td><td>5</td><td>23, m<span class="ov">3</span>, 432, <span class="ov">4</span>3m, m<span class="ov">3</span>m</td><td>Halite, kim cương, fluorite (m<span class="ov">3</span>m); pyrite (m<span class="ov">3</span>)</td></tr>
 <tr><th colspan="2">Tổng</th><th>32</th><td colspan="2">2 + 3 + 3 + 7 + 5 + 7 + 5</td></tr></table></div>
  <div class="note"><b>Ý nghĩa</b>32 lớp đối xứng giúp phân loại và nhận dạng khoáng vật, xác định tính chất vật lý (chiết suất, lưỡng chiết…) và là nền tảng phân tích cấu trúc tinh thể, ứng dụng trong công nghệ vật liệu.</div>`},

 {id:'miller', title:'7. Mặt tinh thể và chỉ số Miller', html:`
 <p>Chỉ số Miller <b>(hkl)</b> là hệ chỉ số dùng để xác định phương hướng của một mặt tinh thể dựa trên giao điểm của mặt với các trục toạ độ.</p>
 <h3>5 bước xác định (hkl)</h3>
 <ol><li>Xác định <b>giao điểm</b> của mặt với các trục a, b, c (theo đơn vị a, b, c).</li>
 <li>Lấy <b>nghịch đảo</b> các giao điểm: 1/a, 1/b, 1/c.</li>
 <li>Khử mẫu chung nhỏ nhất → được <b>ba số nguyên tối giản</b> h, k, l.</li>
 <li>Nếu giao điểm ở phía âm của trục → đặt dấu gạch ngang trên chỉ số (<span class="ov">h</span>).</li>
 <li>Viết trong ngoặc tròn: <b>(hkl)</b>.</li></ol>
 <div class="tw"><table><tr><th>Mặt</th><th>Giao điểm (a, b, c)</th><th>Nghịch đảo</th><th>Miller</th></tr>
 <tr><td>⊥ a (mặt bên)</td><td>1, ∞, ∞</td><td>1, 0, 0</td><td>(100)</td></tr>
 <tr><td>⊥ b</td><td>∞, 1, ∞</td><td>0, 1, 0</td><td>(010)</td></tr>
 <tr><td>⊥ c</td><td>∞, ∞, 1</td><td>0, 0, 1</td><td>(001)</td></tr>
 <tr><td>Mặt chéo</td><td>1, 1, 1</td><td>1, 1, 1</td><td>(111)</td></tr></table></div>
 <div class="card"><h3>Thử ngay: nhập giao điểm → ra chỉ số Miller và mặt được vẽ</h3><div data-w="miller"></div></div>
 <div class="key"><b>Ghi nhớ</b>(hkl): mặt cắt không song song với ba trục. 0 nghĩa là mặt <b>song song</b> với trục đó (giao điểm ở vô cực). {hkl}: <b>họ mặt</b> tương đương do đối xứng (dùng ngoặc nhọn – xem mục 8). [uvw] là phương của một trục. Với tinh thể không vuông (hệ ba, sáu phương) người ta dùng thêm chỉ số thứ tư (hkil) với i = −(h+k).</div>`},

 {id:'hinh-don', title:'8. Hình đơn và hình ghép', html:`
 <div class="two">
  <div class="card" style="border-top:5px solid var(--c1)"><h3>Hình đơn</h3>Tất cả các mặt được suy ra từ <b>1 mặt</b> cho trước thông qua các yếu tố đối xứng. Tinh thể chỉ giới hạn bởi các mặt cùng một hình. Ví dụ: halite {100} (hình lập phương).</div>
  <div class="card" style="border-top:5px solid var(--c2)"><h3>Hình ghép</h3>Tất cả các mặt suy ra từ <b>2 hay nhiều mặt khác nhau</b> (hai hình đơn trở lên). Ví dụ: thạch anh (lăng trụ + hai hình thoi), calcite, fenspat kali.</div></div>
 <div class="key"><b>Ghi nhớ</b>Hình đơn thường có hình dạng đơn giản, cân đối; hình ghép phổ biến hơn trong tự nhiên; hình thái tinh thể chịu ảnh hưởng của điều kiện thành tạo, môi trường và tốc độ phát triển các mặt. Có tất cả <b>47 hình đơn</b> trong tinh thể học.</div>
 <div class="tw"><table><tr><th>Hạng đối xứng</th><th>Các hình đơn tiêu biểu </th></tr>
 <tr><td><b>Hạng thấp</b> (ba nghiêng, một nghiêng, trực thoi)</td><td>1. Một mặt · 2. Đôi mặt · 3. Nhị diện · 4. Lăng trụ thoi · 5. Tứ diện thoi · 6. Tháp thoi · 7. Tháp đôi hệ thoi</td></tr>
 <tr><td><b>Hạng trung</b> (tứ, ba, sáu phương)</td><td>Nhóm lăng trụ (đơn, kép) · nhóm tháp (đơn, kép) · nhóm tháp đôi (đơn, kép) · tứ diện bốn phương · tam giác lệch bốn phương · hình mặt thoi · tam giác lệch ba phương · nhóm hình mặt thang</td></tr>
 <tr><td><b>Hạng cao</b> (lập phương) – 15 hình</td><td>Tứ diện, tứ diện ba tam giác, ba tứ giác, ba ngũ giác, sáu tứ diện · sáu mặt (lập phương), sáu mặt bốn · tám mặt, tám mặt ba tam giác, ba tứ giác, ba ngũ giác, sáu tám mặt · 12 mặt ngũ giác, 24 mặt tứ giác, 12 mặt thoi </td></tr></table></div>
 <div class="note"><b>Cách nhớ</b>Hạng thấp: không có trục bậc &gt; 2. Hạng trung: có <b>một</b> trục bậc &gt; 2 (3, 4 hoặc 6). Hạng cao: có nhiều trục bậc 3 (hệ lập phương). </div>`},

 {id:'tinh-chat', title:'9. Tính chất tinh thể & quan hệ cấu trúc – tính chất', html:`
 <h3>Năm tính chất cơ bản của tinh thể</h3>
 <div class="grid">
  <div class="mini"><h4>1. Tính đồng nhất</h4>Phần khác nhau của tinh thể có cấu trúc và thành phần tương ứng giống nhau. VD: halite đồng nhất trong toàn bộ tinh thể.</div>
  <div class="mini"><h4>2. Tính dị hướng</h4>Một số tính chất vật lý thay đổi theo phương trong tinh thể. VD: calcite có chiết suất khác nhau theo các phương khác nhau.</div>
  <div class="mini"><h4>3. Tính đối xứng</h4>Các yếu tố của tinh thể lặp lại qua phép quay, phản xạ hoặc nghịch đảo. VD: halite có đối xứng cao (hệ lập phương).</div>
  <div class="mini"><h4>4. Tính tự tạo mặt</h4>Khi phát triển trong điều kiện thuận lợi, tinh thể có khả năng tự hình thành các mặt phẳng giới hạn. VD: thạch anh (quartz) lăng trụ sáu cạnh với mặt chóp ở đầu.</div>
  <div class="mini"><h4>5. Góc giữa các mặt không đổi</h4>Góc giữa hai mặt tinh thể tương ứng của cùng một khoáng vật là <b>không đổi</b> ở cùng điều kiện, dù kích thước mặt thay đổi (định luật hằng số góc – Steno).</div></div>
 <h3>Cấu trúc tinh thể → tính chất khoáng vật</h3>
 <p>Cấu trúc tinh thể là <b>nguyên nhân gốc rễ</b> quyết định mọi tính chất của khoáng vật. Chuỗi suy luận: <i>loại liên kết, khoảng cách, phối trí, hình học mạng, đối xứng, kích thước ion, khuyết tật</i> → <i>tính chất</i>.</p>
 <div class="tw"><table><tr><th>Tính chất</th><th>Liên quan đến</th><th>Ví dụ</th></tr>
 <tr><td>Hình dạng</td><td>Hệ tinh thể và mặt ưu tiên phát triển</td><td>Halite: lập phương</td></tr>
 <tr><td>Cát khai</td><td>Mặt liên kết yếu theo một số hướng</td><td>Mica: cát khai hoàn hảo (001); halite: theo (100)</td></tr>
 <tr><td>Độ cứng</td><td>Liên kết trong mạng, độ bền liên kết</td><td>Kim cương (cộng hoá trị 3D) rất cứng; graphite (liên kết yếu giữa lớp) rất mềm</td></tr>
 <tr><td>Nhiệt độ nóng chảy</td><td>Liên kết trong mạng, năng lượng mạng</td><td>Corundum ≈ 2050 °C; halite ≈ 801 °C</td></tr>
 <tr><td>Dẫn điện</td><td>Loại liên kết, cấu trúc điện tử</td><td>Kim loại và graphite dẫn tốt; halite, thạch anh cách điện</td></tr>
 <tr><td>Độ hoà tan</td><td>Năng lượng mạng và mức độ phân cực</td><td>Halite tan dễ trong nước; thạch anh gần như không</td></tr>
 <tr><td>Tỷ trọng</td><td>Khối lượng nguyên tử và độ đóng gói</td><td>Galena (PbS) cao; thạch anh trung bình</td></tr>
 <tr><td>Màu sắc, vết vạch</td><td>Thành phần hoá học và cấu trúc điện tử</td><td>Malachite xanh lục; hematite vết đỏ nâu</td></tr>
 <tr><td>Từ tính</td><td>Sắp xếp moment từ</td><td>Magnetite từ mạnh; thạch anh không từ tính</td></tr></table></div>
 <div class="card"><h3>Ví dụ điển hình: Kim cương – Graphite (cùng là carbon)</h3><div data-w="dg"></div></div>
 <div class="check"><b>Kết luận chương</b>Cùng một nguyên tố hoá học (C) nhưng khác cấu trúc tinh thể → khác tính chất vật lý và hoá học → khác ứng dụng. Hiểu cấu trúc là “chìa khoá” để nhận biết, mô tả, giải thích và ứng dụng khoáng vật một cách khoa học.</div>`}
 ]
});

window.CHAPTERS.push({
 id:'c3', num:3, title:'Khoáng vật học',
 blurb:'Thành phần hoá học, thay thế đồng hình, dung dịch rắn, đa hình; toàn bộ tính chất vật lý; tính chất quang học cơ bản, PPL – XPL.',
 sections:[
 {id:'thanh-phan', title:'1. Thành phần hoá học (1.1–1.3)', html:`
 <div class="card"><h3>Mục tiêu chương</h3><ul>
 <li>Trình bày thành phần hoá học và các dạng biến đổi thành phần của khoáng vật.</li>
 <li>Giải thích mối liên hệ giữa cấu trúc tinh thể, liên kết hoá học và tính chất khoáng vật.</li>
 <li>Nhận biết khoáng vật dựa trên tính chất vật lý cơ bản; mô tả tính chất quang học cơ bản.</li>
 <li>Giải thích quá trình hình thành, biến đổi, phá huỷ; phân loại theo thành phần hoá học và anion chủ đạo; nhận diện khoáng vật tạo đá và khoáng vật quặng phổ biến.</li></ul>
 </div>
 <h3>1.1. Khái niệm thành phần hoá học</h3>
 <ul><li>Nguyên tố hoá học cấu tạo nên khoáng vật.</li><li>Công thức hoá học của khoáng vật.</li><li>Thành phần <b>lý tưởng</b> và thành phần <b>thực tế</b> (thường lệch vì thay thế đồng hình, tạp chất).</li>
 <li>Khoáng vật <b>đơn chất</b> (vàng Au, kim cương C, than chì C) và <b>hợp chất</b> (calcite CaCO₃, orthoclase KAlSi₃O₈, thạch anh SiO₂).</li></ul>
 <h3>1.2. Các nguyên tố phổ biến trong vỏ Trái Đất</h3>
 <p><b>Chỉ số Clarke</b> là hàm lượng trung bình của một nguyên tố trong vỏ Trái Đất (% khối lượng hoặc ppm). Rê chuột / bấm vào từng cột:</p>
 <div data-w="clarke"></div>
 <div class="key"><b>Ghi nhớ</b>Chỉ <b>8 nguyên tố</b> (O, Si, Al, Fe, Ca, Na, K, Mg) chiếm <b>98,5%</b> khối lượng vỏ Trái Đất; hơn 90 nguyên tố còn lại chỉ ≈ 1,5%. Vì oxy và silic áp đảo nên <b>silicat</b> là nhóm khoáng vật phổ biến nhất – đơn vị cấu trúc cơ bản là tứ diện SiO₄.</div>
 <h3>1.3. Công thức hoá học khoáng vật – đọc “mật mã” của olivine (Mg,Fe)₂SiO₄</h3>
 <div class="tw"><table><tr><th>Phần</th><th>Ý nghĩa</th></tr>
 <tr><td>SiO₄</td><td>Đơn vị cấu trúc dạng <b>tứ diện</b>: Si⁴⁺ ở giữa, 4 O²⁻ ở đỉnh</td></tr>
 <tr><td>(Mg,Fe)</td><td>Hai cation <b>cùng chiếm một vị trí tinh thể học</b> (vị trí bát diện M) – dấu phẩy nghĩa là “thay thế lẫn nhau”</td></tr>
 <tr><td>Chỉ số dưới 2</td><td>Có 2 vị trí M cho mỗi Si</td></tr>
 <tr><td>Mg²⁺ ↔ Fe²⁺</td><td><b>Thay thế đồng hình</b>: cùng điện tích +2, bán kính gần nhau</td></tr></table></div>
 <p>Như vậy một công thức khoáng vật cho biết cùng lúc: <b>thành phần – cấu trúc – vị trí tinh thể học – khả năng thay thế đồng hình</b>.</p>`},

 {id:'thay-the', title:'2. Liên kết và thay thế đồng hình (1.4–1.5)', html:`
 <h3>1.4. Liên kết hoá học trong khoáng vật</h3>
 <p>(Đã học ở Chương 2, mục 4.) Tóm tắt nhanh:</p>
 <div class="tw"><table><tr><th>Kiểu liên kết</th><th>Đặc điểm chính</th><th>Tính chất thường gặp</th></tr>
 <tr><td>Ion</td><td>Lực hút giữa các ion trái dấu</td><td>Giòn, độ cứng trung bình</td></tr>
 <tr><td>Cộng hoá trị</td><td>Dùng chung electron</td><td>Bền, thường có độ cứng cao</td></tr>
 <tr><td>Kim loại</td><td>Electron chuyển động tự do</td><td>Dẫn điện, ánh kim</td></tr>
 <tr><td>Van der Waals</td><td>Liên kết yếu</td><td>Mềm, dễ tách</td></tr>
 <tr><td>Hydrogen</td><td>Liên quan đến nhóm OH hoặc H₂O</td><td>Ảnh hưởng độ bền và nhiệt</td></tr></table></div>
 <div class="note">Calcite có nhiều kiểu liên kết: cộng hoá trị C–O trong CO₃²⁻ và tương tác ion giữa Ca²⁺ với CO₃²⁻.</div>
 <h3>1.5. Hiện tượng thay thế đồng hình</h3>
 <div class="key"><b>Định nghĩa</b>Các ion có <b>kích thước tương đương</b> thay thế nhau tại cùng vị trí tinh thể học.</div>
 <div class="grid"><div class="mini"><h4>Đồng hoá trị</h4>Mg²⁺ ↔ Fe²⁺ (olivine). Điện tích như nhau (+2 ↔ +2) nên cân bằng điện tích sẵn.</div>
 <div class="mini"><h4>Dị hoá trị</h4>Na⁺ + Si⁴⁺ ↔ Ca²⁺ + Al³⁺ (plagioclase). Điện tích tổng (+5 = +5) vẫn cân bằng nhờ <b>thay thế ghép cặp</b>.</div></div>
 <p>Ba yếu tố quyết định khả năng thay thế: <b>bán kính ion gần nhau</b>, <b>điện tích phù hợp</b>, <b>nhiệt độ – áp suất thích hợp</b> (nhiệt độ cao làm thay thế dễ hơn).</p>
 <div class="card"><h3>Bảng bán kính ion theo số phối trí (Å) + máy kiểm tra thay thế</h3><div data-w="iso"></div></div>
 <div class="warn"><b>Nhớ</b>Bán kính ion <b>không cố định</b>: phụ thuộc số phối trí (CN), trạng thái oxy hoá và spin. Vì vậy phải so sánh các ion ở <b>cùng CN</b>.</div>`},

 {id:'dung-dich-ran', title:'3. Dung dịch rắn, đa hình, tạp chất & màu (1.6–1.8)', html:`
 <h3>1.6. Dung dịch rắn</h3>
 <p>Dung dịch rắn là cấu trúc tinh thể có <b>thành phần hoá học biến đổi</b>: giữ nguyên khung tinh thể, chỉ thay đổi tỷ lệ các ion thay thế.</p>
 <div class="grid"><div class="mini"><h4>Hoàn toàn</h4>Có thể trộn ở mọi tỷ lệ 0–100%. VD: forsterite Mg₂SiO₄ – fayalite Fe₂SiO₄; albite NaAlSi₃O₈ – anorthite CaAl₂Si₂O₈ (chuỗi plagioclase).</div>
 <div class="mini"><h4>Không hoàn toàn (hạn chế)</h4>Chỉ thay thế được trong khoảng giới hạn; có khoảng không trộn lẫn. VD: calcite CaCO₃ – magnesite MgCO₃ (khoảng không trộn lẫn ở nhiệt độ thấp); sphalerite (Zn,Fe)S chỉ chứa Fe hạn chế.</div></div>
 <div class="card"><h3>Trượt thử: thay đổi thành phần dung dịch rắn</h3><div data-w="solid"></div></div>
 <h3>1.7. Đa hình và đồng hình</h3>
 <div class="two"><div class="mini"><h4>Đa hình (polymorphism)</h4>Cùng thành phần hoá học nhưng <b>khác cấu trúc</b> (→ khác tính chất).</div>
 <div class="mini"><h4>Đồng hình (isomorphism)</h4>Cấu trúc tương tự nhưng <b>thành phần khác</b> (VD: forsterite – fayalite).</div></div>
 <div class="tw"><table><tr><th>Thành phần</th><th>Các dạng đa hình</th><th>Điều kiện / đặc điểm</th></tr>
 <tr><td>C</td><td>Kim cương – graphite</td><td>Cấu trúc và độ cứng khác nhau</td></tr>
 <tr><td>CaCO₃</td><td>Calcite – aragonite</td><td>Hệ tinh thể khác nhau (ba phương – trực thoi)</td></tr>
 <tr><td>Al₂SiO₅</td><td>Andalusite – kyanite – sillimanite</td><td>Chỉ thị nhiệt độ – áp suất</td></tr>
 <tr><td>SiO₂</td><td>Quartz – tridymite – cristobalite</td><td>Bền ở các khoảng nhiệt độ khác nhau</td></tr></table></div>
 <div class="card"><h3>Chỉ thị nhiệt độ – áp suất: Al₂SiO₅ (nhấp chuột vào giản đồ)</h3><div data-w="poly"></div></div>
 <h3>1.8. Tạp chất và màu sắc khoáng vật</h3>
 <p>Thạch anh trong suốt vốn không màu, nhưng có thể tím, khói, hồng… vì các nguyên nhân sau (bấm thẻ để xem):</p>
 <div data-w="colors"></div>`},

 {id:'hinh-dang', title:'4. Hình dạng, song tinh, màu sắc (2.1–2.2)', html:`
 <p>Tính chất vật lý là công cụ <b>nhận dạng nhanh</b> ở ngoài thực địa và trong phòng thực tập – không cần máy móc phức tạp.</p>
 <h3>2.1. Hình dạng tinh thể và tập hợp khoáng vật</h3>
 <div class="two"><div class="card"><h4>Mức độ tự hình</h4><ul><li><b>Tự hình (euhedral)</b>: đủ mặt tinh thể</li><li><b>Nửa tự hình (subhedral)</b>: một phần mặt</li><li><b>Tha hình (anhedral)</b>: không có mặt tinh thể (mọc chen chúc)</li></ul></div>
 <div class="card"><h4>Dạng tinh thể</h4>Đẳng thước · dạng tấm · dạng lá · dạng kim · dạng sợi · dạng trụ.</div></div>
 <div class="card"><h4>Dạng tập hợp</h4>Dạng hạt · khối đặc sít · toả tia · dạng sợi · chùm nho (botryoidal) · dạng thận · dạng nhũ (thạch nhũ) · dạng đất · dendrite (hình cây).</div>
 <h4>Song tinh (twinning)</h4>
 <div class="grid"><div class="mini"><h4>1. Đơn giản</h4>Hai cá thể chung một mặt song tinh. VD: calcite.</div><div class="mini"><h4>2. Chữ thập</h4>Hai cá thể xuyên vào nhau. VD: staurolite.</div>
 <div class="mini"><h4>3. Đa hợp</h4>Nhiều cá thể lặp lại song song → “vân” song tinh. VD: plagioclase (luật albite).</div><div class="mini"><h4>4. Vòng</h4>Nhiều cá thể sắp xếp quanh một trục. VD: aragonite.</div></div>
 <h3>2.2. Màu sắc</h3>
 <div class="grid">
 <div class="mini"><h4>Tự sắc (idiochromatic)</h4>Do nguyên tố chính trong thành phần. Malachite xanh lục, azurite xanh lam (Cu²⁺), sulfur vàng.</div>
 <div class="mini"><h4>Ngoại sắc (allochromatic)</h4>Do tạp chất hoặc khuyết tật mạng. Thạch anh: không màu, tím (amethyst), khói, hồng…</div>
 <div class="mini"><h4>Giả sắc (pseudochromatic)</h4>Do hiệu ứng quang học – màu đổi theo góc nhìn. VD: labradorite.</div></div>
 <div class="warn"><b>Cẩn thận</b>Màu sắc không phải lúc nào cũng có giá trị chẩn đoán cao. Luôn kết hợp với vết vạch, độ cứng, cát khai.</div>`},

 {id:'vet-vach', title:'5. Vết vạch, ánh, độ trong suốt (2.3–2.5)', html:`
 <h3>2.3. Vết vạch (streak)</h3>
 <p><b>Vết vạch là màu của bột khoáng vật.</b> Cách thử: (1) chọn bề mặt khoáng vật; (2) kéo trên tấm sứ không tráng men; (3) quan sát màu bột.</p>
 <div class="tw"><table><tr><th>Khoáng vật</th><th>Màu khoáng vật</th><th>Vết vạch</th></tr>
 <tr><td>Hematite</td><td>Xám đen (hoặc đỏ)</td><td><b>Đỏ nâu</b></td></tr>
 <tr><td>Magnetite</td><td>Đen</td><td>Đen</td></tr>
 <tr><td>Pyrite</td><td>Vàng đồng</td><td>Đen hơi xanh</td></tr></table></div>
 <div class="warn"><b>Giới hạn</b>Khoáng vật cứng hơn tấm sứ (H ≈ 6,5–7) chỉ làm xước bề mặt sứ chứ không cho bột vết vạch (ví dụ thạch anh H = 7).</div>
 <h3>2.4. Ánh (luster)</h3>
 <p>Ánh là khả năng ánh sáng phản xạ trên bề mặt khoáng vật.</p>
 <div class="grid"><div class="mini"><h4>Ánh kim</h4>Như kim loại, không trong suốt. VD: galena.</div><div class="mini"><h4>Ánh bán kim</h4>Kim loại mờ. VD: hematite.</div>
 <div class="mini"><h4>Ánh phi kim</h4>Thuỷ tinh (quartz) · kim cương (diamond) · ngọc trai (muscovite) · tơ (satin spar – gypsum dạng sợi) · nhựa (sphalerite) · sáp (chalcedony) · đất (kaolinite).</div></div>
 <h3>2.5. Độ trong suốt</h3>
 <div class="grid"><div class="mini"><h4>Trong suốt</h4>Nhìn rõ vật phía sau (thạch anh).</div><div class="mini"><h4>Bán trong</h4>Ánh sáng truyền qua một phần, không nhìn rõ (chalcedony – mã não).</div><div class="mini"><h4>Không trong suốt</h4>Ánh sáng không truyền qua (galena).</div></div>
 <p><b>Các yếu tố ảnh hưởng:</b> chiều dày (mỏng → sáng hơn), khe nứt (tán xạ ánh sáng), tạp chất (giảm độ trong).</p>
 <div class="key"><b>Mẹo</b>Hầu hết khoáng vật ánh kim đều <i>không trong suốt</i>, và khoáng vật ánh kim thường có vết vạch đậm màu.</div>`},

 {id:'do-cung', title:'6. Độ cứng và thang Mohs (2.6)', html:`
 <p>Độ cứng là khả năng chống lại sự làm xước bề mặt. <b>Thang Mohs</b> là thang tương đối (không tuyến tính) gồm 10 khoáng vật chuẩn:</p>
 <div data-w="mohs"></div>
 <div class="key"><b>Quy tắc thử</b>Khoáng vật cứng hơn làm xước được khoáng vật mềm hơn. Vật thử tiện dụng: móng tay ≈ 2,5 · đồng xu ≈ 3–3,5 · kính ≈ 5,5. Phải quan sát <b>vết xước thật</b>, đừng nhầm với vệt bột (vạch) do khoáng vật mềm để lại.</div>
 <div class="warn"><b>Độ cứng ≠ độ bền cơ học</b>Kim cương (H = 10) cứng nhất nhưng rất giòn, có cát khai nên đập vỡ được; ngọc jade (nephrite) có độ cứng thấp hơn nhưng rất dai, chống vỡ tốt.</div>
 <div class="note"><b>Tính không tuyến tính</b>Từ 9 (corundum) lên 10 (kim cương), độ cứng tuyệt đối tăng rất nhiều lần, lớn hơn cả khoảng từ 1 đến 9 gộp lại – nên đừng coi thang Mohs là thước đo đều.</div>`},

 {id:'cat-khai', title:'7. Cát khai, vết vỡ, dai – giòn (2.7–2.9)', html:`
 <h3>2.7. Cát khai (cleavage)</h3>
 <p>Cát khai là khả năng khoáng vật tách theo các <b>mặt phẳng cấu trúc nhất định</b> (nơi liên kết yếu). Ví dụ trong cấu trúc lớp: liên kết mạnh trong lớp, liên kết yếu giữa các lớp → tách theo mặt lớp.</p>
 <p>Mô tả cát khai theo 3 tiêu chí: <b>mức độ</b> (hoàn toàn – tốt – kém), <b>số phương</b>, và <b>góc</b> giữa các phương.</p>
 <div data-w="cleave"></div>
 <h3>2.8. Vết vỡ (fracture)</h3>
 <div class="grid"><div class="mini"><h4>Vỏ sò</h4>Bề mặt cong như vỏ sò – quartz (không có cát khai).</div><div class="mini"><h4>Không đều</h4>Magnetite.</div><div class="mini"><h4>Dạng sợi</h4>Chrysotile.</div><div class="mini"><h4>Dạng móc</h4>Bề mặt gồ ghề, nhọn – đồng tự sinh.</div></div>
 <div class="key"><b>Phân biệt</b>Mặt cát khai: <b>phẳng, lặp lại theo phương xác định, liên quan cấu trúc tinh thể</b> (ví dụ feldspar K). Mặt vỡ: cong hoặc không đều, không lặp lại theo phương cố định, không theo mặt cát khai (ví dụ quartz). Cát khai ≠ mặt vỡ.</div>
 <h3>2.9. Tính dai – giòn</h3>
 <div class="grid">
 <div class="mini"><h4>Giòn</h4>Vỡ vụn khi chịu lực – quartz.</div><div class="mini"><h4>Dễ dát mỏng</h4>Vàng → lá mỏng.</div><div class="mini"><h4>Dễ kéo sợi</h4>Đồng → dây.</div>
 <div class="mini"><h4>Dễ cắt</h4>Gypsum cắt được bằng dao.</div><div class="mini"><h4>Dẻo (flexible)</h4>Uốn cong, không trở lại – chlorite.</div><div class="mini"><h4>Đàn hồi</h4>Uốn cong rồi trở lại hình dạng ban đầu – mica.</div></div>`},

 {id:'ty-trong', title:'8. Tỷ trọng và tính chất đặc biệt (2.10–2.11)', html:`
 <h3>2.10. Tỷ trọng</h3>
 <div class="key"><b>Công thức</b>Tỷ trọng = ρ<sub>khoáng vật</sub> / ρ<sub>nước</sub> (cùng thể tích). Không có đơn vị; nước = 1.</div>
 <p>Hai yếu tố quyết định: <b>thành phần hoá học</b> (nguyên tố có khối lượng nguyên tử lớn → tỷ trọng cao) và <b>cấu trúc tinh thể</b> (sắp xếp càng chặt → tỷ trọng càng cao; xem kim cương 3,51 vs graphite 2,26).</p>
 <div data-w="density"></div>
 <p>Khoáng vật chứa nguyên tố kim loại nặng thường có tỷ trọng cao.</p>
 <h3>2.11. Các tính chất đặc biệt</h3>
 <div class="tw"><table><tr><th>Tính chất</th><th>Cách thử / ví dụ</th></tr>
 <tr><td>Từ tính</td><td>Magnetite hút nam châm</td></tr>
 <tr><td>Phản ứng với HCl</td><td>Calcite sủi bọt mạnh; dolomite yếu / chỉ khi ở dạng bột</td></tr>
 <tr><td>Vị</td><td>Halite có vị mặn</td></tr>
 <tr><td>Mùi</td><td>Có mùi khi cọ xát hoặc tác động (ví dụ khoáng vật chứa lưu huỳnh)</td></tr>
 <tr><td>Cảm giác trơn</td><td>Talc</td></tr>
 <tr><td>Phát quang</td><td>Fluorite dưới tia UV</td></tr>
 <tr><td>Phóng xạ</td><td>Uraninite</td></tr>
 <tr><td>Dẫn điện</td><td>Graphite</td></tr>
 <tr><td>Song tinh</td><td>Plagioclase (vân song tinh)</td></tr>
 <tr><td>Khúc xạ kép</td><td>Calcite (nhìn chữ qua tinh thể thấy hai ảnh)</td></tr></table></div>
 <div class="warn"><b>An toàn phòng thí nghiệm (L.O.3.1)</b><ul style="margin:4px 0 0"><li>Không nếm mẫu lạ (chỉ nếm mẫu halite khi được hướng dẫn).</li><li>HCl cần kính bảo hộ và găng tay.</li><li>Không cầm mẫu phóng xạ.</li></ul></div>`},

 {id:'nhan-dang', title:'9. Thực hành: công cụ nhận dạng khoáng vật', html:`
 <p>Trong thực hành và thi thực hành, bạn phải nhận dạng mẫu bằng tổ hợp tính chất. Hãy chọn các tính chất quan sát được và xem những khoáng vật còn phù hợp. (Dữ liệu tổng hợp từ các tính chất chuẩn của khoáng vật thông dụng.)</p>
 <div data-w="ident"></div>
 <div class="note"><b>Quy trình gợi ý</b>Ánh (kim / phi kim) → độ cứng (thử móng tay, đồng xu, kính) → vết vạch → cát khai / vết vỡ → tính chất đặc biệt (HCl, từ tính, tỷ trọng). Ghi chép có hệ thống.</div>`},

 {id:'anh-sang', title:'10. Ánh sáng và chiết suất (3.1–3.3)', html:`
 <h3>3.1. Bản chất của ánh sáng</h3>
 <ul><li>Ánh sáng là <b>sóng điện từ</b> gồm điện trường <b>E</b> và từ trường <b>B</b>; E, B và phương truyền k vuông góc với nhau.</li>
 <li>Ánh sáng nhìn thấy có bước sóng khoảng <b>380–700 nm</b>: tím – bước sóng ngắn; đỏ – bước sóng dài.</li>
 <li><b>Ánh sáng tự nhiên</b> dao động theo nhiều phương ngẫu nhiên. Sau khi qua kính phân cực, ánh sáng chỉ còn dao động theo <b>một phương xác định</b> (vuông góc với phương truyền) = ánh sáng phân cực.</li></ul>
 <div class="card"><h4>Mô phỏng: hai kính phân cực (định luật Malus)</h4><div data-w="polar"></div></div>
 <h3>3.2. Tương tác giữa ánh sáng và khoáng vật</h3>
 <div class="grid"><div class="mini"><h4>Truyền qua</h4>Khoáng vật trong suốt, cường độ ít giảm.</div><div class="mini"><h4>Hấp thụ</h4>Khoáng vật có màu: hấp thụ một số bước sóng, phần còn lại tạo màu ta thấy.</div><div class="mini"><h4>Phản xạ</h4>Trên bề mặt (góc tới i = góc phản xạ r) → ánh.</div>
 <div class="mini"><h4>Khúc xạ</h4>Tia bị bẻ khi vào môi trường khác (n &gt; 1).</div><div class="mini"><h4>Tán sắc</h4>Ánh sáng trắng tách màu qua lăng kính khoáng vật.</div><div class="mini"><h4>Khúc xạ kép</h4>Tia bị tách thành 2 tia: thường (o) và bất thường (e) – calcite.</div></div>
 <h3>3.3. Chiết suất</h3>
 <div class="key"><b>Công thức</b>n = c / v (c ≈ 3,00×10⁸ m/s – vận tốc ánh sáng trong chân không; v – vận tốc trong khoáng vật; n ≥ 1). Tần số không đổi khi vào môi trường; bước sóng λ = λ₀/n. Chiết suất tương đối n₂₁ = n₂/n₁ = v₁/v₂.</div>
 <div class="card"><h4>Mô phỏng: khúc xạ (định luật Snell)</h4><div data-w="snell"></div></div>
 <div class="card"><h4>Ảnh hưởng dưới kính hiển vi: độ nổi</h4><p style="margin-top:0">Độ nổi phụ thuộc <b>|n<sub>khoáng vật</sub> − n<sub>môi trường</sub>|</b>. Độ tương phản (độ nổi) thấp: đường viền mờ; cao: đường viền rõ.</p><div data-w="relief"></div></div>
 <div class="check"><b>Kết luận</b>Chiết suất là tính chất quang học đặc trưng → hỗ trợ nhận diện khoáng vật.</div>`},

 {id:'dang-huong', title:'11. Đẳng hướng, dị hướng, một trục – hai trục (3.4–3.5)', html:`
 <h3>3.4. Khoáng vật đẳng hướng và dị hướng</h3>
 <div class="two"><div class="card" style="border-top:5px solid var(--c1)"><h4>Đẳng hướng</h4><ul><li>Tính chất quang học giống nhau theo mọi phương.</li><li>Hệ lập phương và vật liệu vô định hình.</li><li>Chỉ thị quang học: <b>hình cầu</b> (một chiết suất n).</li><li>Dưới hai nicol vuông góc (XPL): <b>luôn tối</b>, dù xoay bàn kính.</li><li>VD: garnet, spinel, fluorite.</li></ul></div>
 <div class="card" style="border-top:5px solid var(--c2)"><h4>Dị hướng</h4><ul><li>Tính chất quang học thay đổi theo phương.</li><li>Chỉ thị quang học: <b>hình elip</b> (hai hoặc ba chiết suất chính).</li><li>Dưới XPL: xuất hiện <b>màu giao thoa</b> và sáng – tối khi xoay bàn kính (4 lần sáng, 4 lần tối trong 360°).</li><li>VD: quartz, feldspar, mica, calcite, pyroxene, amphibole.</li></ul></div></div>
 <h3>3.5. Khoáng vật một trục và hai trục</h3>
 <div class="two"><div class="mini"><h4>Một trục</h4>Hệ bốn phương, ba phương, sáu phương. Một trục quang. Chỉ thị: elipsoid tròn xoay với hai chiết suất chính n<sub>o</sub> (thường) và n<sub>e</sub> (bất thường). <br><b>Dấu (+)</b>: n<sub>e</sub> &gt; n<sub>o</sub>; <b>dấu (−)</b>: n<sub>e</sub> &lt; n<sub>o</sub>. Quartz (+), calcite (−).</div>
 <div class="mini"><h4>Hai trục</h4>Hệ trực thoi, một nghiêng, ba nghiêng. Hai trục quang. Ba chiết suất chính: n<sub>α</sub> &lt; n<sub>β</sub> &lt; n<sub>γ</sub>. Góc trục quang 2V. Dấu (+): phân giác góc nhọn là Z; dấu (−): là X. Olivine (+), biotite (−).</div></div>
 <div class="card"><h4>Chỉ thị quang học (indicatrix) tương tác</h4><div data-w="indic"></div></div>
 <div class="note"><b>Trục quang</b>Là phương truyền ánh sáng mà khoáng vật không biểu hiện khúc xạ kép: tia tới theo trục quang không bị tách tia, chỉ có một tia truyền qua; tia tới xiên (không theo trục quang) bị tách thành tia thường (n<sub>o</sub>) và tia bất thường (n<sub>e</sub>).</div>`},

 {id:'ppl-xpl', title:'12. Kính hiển vi: PPL, XPL (3.6–3.8)', html:`
 <h3>3.6. Dưới ánh sáng phân cực phẳng – PPL</h3>
 <p>Các đặc điểm quan sát (chỉ dùng <b>một</b> nicol phân cực): màu sắc · đa sắc (pleochroism) · độ nổi · hình dạng hạt · cát khai · khe nứt · sản phẩm biến đổi · bao thể.</p>
 <div class="tw"><table><tr><th>Khoáng vật</th><th>Màu</th><th>Độ nổi</th><th>Đặc điểm khác dưới PPL</th></tr>
 <tr><td>Biotite</td><td>Nâu; <b>đa sắc mạnh</b> (nâu nhạt ↔ nâu sẫm khi quay bàn kính 90°)</td><td>—</td><td>Một phương cát khai</td></tr>
 <tr><td>Hornblende</td><td>Xanh hoặc nâu; đa sắc (xanh lục ↔ nâu)</td><td>—</td><td>Hai phương cát khai cắt nhau 56°/124°</td></tr>
 <tr><td>Quartz</td><td>Không màu</td><td>Thấp</td><td>Không cát khai, bề mặt sạch</td></tr>
 <tr><td>Olivine</td><td>Không màu</td><td><b>Cao</b></td><td>Nhiều khe nứt</td></tr></table></div>
 <div class="key"><b>Trình tự quan sát</b>màu – đa sắc → độ nổi → hình dạng → cát khai / khe nứt → biến đổi và bao thể.</div>
 <h3>3.7. Dưới hai nicol vuông góc – XPL</h3>
 <ul><li>Ánh sáng phân cực đi qua khoáng vật dị hướng bị tách thành hai tia dao động vuông góc – một tia <b>nhanh</b> (n nhỏ), một tia <b>chậm</b> (n lớn).</li>
 <li>Lưỡng chiết suất: <b>Δn = n<sub>chậm</sub> − n<sub>nhanh</sub></b>. Độ trễ quang: <b>δ = t · Δn</b> (t: bề dày lát mỏng, chuẩn ≈ 0,03 mm).</li>
 <li>Màu giao thoa phụ thuộc bậc (bậc thấp → bậc cao) – xem mô phỏng.</li>
 <li><b>Hiện tượng tắt</b>: xảy ra khi phương dao động chính của khoáng vật trùng với phương dao động của nicol → không có ánh sáng đi qua. Góc tắt là góc giữa phương cát khai (hoặc phương kéo dài chuẩn) và vị trí tắt. Có tắt thẳng (0°), tắt xiên, tắt đối xứng; ngoài ra còn song tinh và phân đới.</li></ul>
 <div class="card"><h4>Phòng thí nghiệm XPL: xoay bàn kính, đổi bề dày, chọn khoáng vật</h4><div data-w="xpl"></div></div>
 <table><tr><th>Khoáng vật</th><th>Màu giao thoa</th></tr><tr><td>Quartz</td><td>Bậc thấp (xám – trắng – vàng), có tắt lượn sóng</td></tr><tr><td>Plagioclase</td><td>Bậc thấp; nổi bật <b>song tinh đa hợp</b></td></tr><tr><td>Calcite</td><td><b>Bậc cao</b> (rất rực rỡ)</td></tr><tr><td>Pyroxene</td><td>Bậc trung bình; cát khai gần 90° (87°/93°)</td></tr></table>
 <h3>3.8. Mối liên hệ giữa cấu trúc và tính chất quang học</h3>
 <div class="grid"><div class="mini"><h4>Tính đối xứng</h4>Lập phương → đẳng hướng; bốn, ba, sáu phương → dị hướng một trục; các hệ còn lại → hai trục.</div>

 <div class="mini"><h4>Thành phần hoá học</h4>Loại ion, hàm lượng và khả năng phân cực electron chi phối chiết suất, màu sắc, lưỡng chiết suất (Fe/Mg → chiết suất; Cr/Fe → màu).</div>

    { id: 'hinh-thanh', title: '13. Sự hình thành khoáng vật (4.1–4.2)', html: `
 <p>Khoáng vật không tự nhiên xuất hiện: mỗi khoáng vật là kết quả của một quá trình cụ thể trong một môi trường cụ thể. Bài này trả lời: <b>khoáng vật hình thành bằng những con đường nào, và điều gì quyết định khoáng vật nào xuất hiện?</b></p>
 <h3>4.1. Sáu con đường hình thành khoáng vật</h3>
 <p>Bấm vào từng thẻ để xem cơ chế và ví dụ:</p>
 <div class="card"><div data-w="pick" data-k="formation"></div></div>
 <div class="key"><b>Nhớ nhanh</b>Magma → kết tinh · Dung dịch nhiệt dịch/nước → kết tủa khi quá bão hoà · Biến chất → tái kết tinh ở thể rắn · Phong hoá → khoáng vật thứ sinh (sét, oxide sắt…) · Sinh vật → CaCO₃, phosphate Ca.</div>
 <h3>Kết tinh từ magma: dãy phản ứng Bowen</h3>
 <p>Khi magma nguội, các khoáng vật không kết tinh cùng lúc mà theo một <b>trình tự</b>. Khoáng vật kết tinh sớm ở nhiệt độ cao (~1200 °C) là các khoáng vật giàu Mg, Fe; khoáng vật kết tinh muộn ở nhiệt độ thấp (~650 °C) giàu Si, Na, K. Kéo thanh trượt để “làm nguội” magma:</p>
 <div class="card"><h3>Dãy phản ứng Bowen</h3><div data-w="bowen"></div></div>
 <div class="note"><b>Mở rộng</b>Dãy Bowen là mô hình khái quát; trình tự kết tinh thực tế phức tạp hơn (phụ thuộc nhiệt độ, áp suất, thành phần và tốc độ nguội của magma). Nhánh không liên tục: olivine → pyroxene → amphibole → biotite (khoáng vật này phản ứng với magma còn lại để tạo khoáng vật mới). Nhánh liên tục: plagioclase đổi dần từ giàu Ca sang giàu Na. Hai nhánh hội tụ ở các khoáng vật kết tinh muộn: K-feldspar, muscovite, quartz.</div>
 <h3>4.2. Điều kiện chi phối sự hình thành khoáng vật</h3>
 <div class="tw"><table><tr><th>Nhóm điều kiện</th><th>Yếu tố</th><th>Vai trò</th></tr>
 <tr><td rowspan="3"><b>Vật lý</b></td><td>Nhiệt độ</td><td>Chi phối độ bền và phản ứng khoáng vật</td></tr>
 <tr><td>Áp suất</td><td>Chi phối pha khoáng và cấu trúc tinh thể</td></tr>
 <tr><td>Thời gian</td><td>Quyết định mức độ phản ứng và phát triển tinh thể</td></tr>
 <tr><td rowspan="4"><b>Môi trường hoá học</b></td><td>Thành phần hoá học</td><td>Quy định các nguyên tố có thể tạo khoáng vật</td></tr>
 <tr><td>pH</td><td>Chi phối độ tan và kết tủa</td></tr>
 <tr><td>Eh</td><td>Chi phối trạng thái oxy hoá – khử (ví dụ Fe²⁺ ⇌ Fe³⁺)</td></tr>
 <tr><td>Hoạt độ nước (a<sub>w</sub>)</td><td>Chi phối phản ứng hydrat hoá và khử nước</td></tr>
 <tr><td rowspan="2"><b>Động học và không gian</b></td><td>Tốc độ nguội</td><td>Nguội chậm → tinh thể lớn; nguội nhanh → tinh thể nhỏ</td></tr>
 <tr><td>Không gian kết tinh</td><td>Chi phối kích thước và hình dạng tinh thể (khoang rỗng → tinh thể phát triển tự do; khe nứt hẹp → bị hạn chế)</td></tr>
 <tr><td><b>Sinh học</b></td><td>Hoạt động sinh vật</td><td>Tạo khoáng vật trực tiếp hoặc làm thay đổi môi trường kết tủa</td></tr></table></div>
 <div class="warn"><b>Lưu ý</b>Các yếu tố tương tác với nhau; hiếm khi chỉ một yếu tố quyết định khoáng vật được hình thành. Tập hợp chúng quyết định độ bền, thành phần, kích thước và hình dạng của khoáng vật.</div>`},

    { id: 'bien-doi', title: '14. Biến đổi khoáng vật: nguyên sinh – thứ sinh, độ bền, giả hình (4.3–4.6)', html: `
 <p>Sau khi hình thành, khoáng vật có thể bị biến đổi khi điều kiện môi trường thay đổi. Bài này giải thích khoáng vật nào bị biến đổi, vì sao, và dấu vết để lại.</p>
 <h3>4.3. Khoáng vật nguyên sinh và thứ sinh</h3>
 <div class="tw"><table><tr><th></th><th>Khoáng vật nguyên sinh (primary)</th><th>Khoáng vật thứ sinh (secondary)</th></tr>
 <tr><td><b>Hình thành</b></td><td>Cùng với đá ban đầu</td><td>Do biến đổi khoáng vật có trước</td></tr>
 <tr><td><b>Nơi gặp</b></td><td>Phổ biến trong đá magma chưa biến đổi</td><td>Phổ biến trong đới phong hoá và đá biến đổi</td></tr>
 <tr><td><b>Trạng thái</b></td><td>Còn tươi và giữ cấu trúc ban đầu</td><td>Phản ánh điều kiện hoá – lý sau khi đá hình thành</td></tr>
 <tr><td><b>Ví dụ</b></td><td>Olivine, pyroxene, feldspar</td><td>Kaolinite, chlorite, serpentine, goethite</td></tr></table></div>
 <div class="note"><b>Cách xác định</b>Khái niệm nguyên sinh – thứ sinh được xác định theo <b>lịch sử hình thành và biến đổi của đá</b>, không theo tên khoáng vật. (Cùng một khoáng vật, ví dụ quartz, có thể là nguyên sinh hay thứ sinh tuỳ nó hình thành khi nào.)</div>
 <h3>4.4. Độ bền khoáng vật: dãy Goldich</h3>
 <p>Khoáng vật bền khi điều kiện bề mặt <b>giống</b> điều kiện lúc nó kết tinh. Khoáng vật kết tinh ở nhiệt độ cao, sâu trong Trái Đất, khác nhiều so với bề mặt (nhiệt độ thấp, nhiều H₂O–O₂–CO₂) nên <b>dễ phong hoá hơn</b>. Điều này được thể hiện trong <b>dãy bền phong hoá Goldich</b>, ngược chiều với dãy Bowen:</p>
 <div class="tw"><table><tr><th>Dãy Bowen (khoáng vật kết tinh)</th><th>Kết tinh</th><th>Độ bền phong hoá (Goldich)</th></tr>
 <tr><td>Olivine, plagioclase giàu Ca</td><td>Sớm, nhiệt độ cao</td><td>Kém bền, phong hoá nhanh</td></tr>
 <tr><td>Pyroxene, amphibole, plagioclase giàu Na</td><td>Trung gian</td><td>Trung bình</td></tr>
 <tr><td>Biotite, K-feldspar, muscovite</td><td>Muộn</td><td>Bền hơn</td></tr>
 <tr><td>Quartz</td><td>Muộn nhất, nhiệt độ thấp</td><td>Bền nhất, phong hoá chậm</td></tr></table></div>
 <div class="warn"><b>Chú ý</b>Goldich phản ánh xu hướng tương đối. Tốc độ phong hoá thực tế còn phụ thuộc khí hậu, khe nứt và thời gian. Ví dụ: olivine kết tinh nhiệt độ cao → dễ phong hoá thành sản phẩm phong hoá (nâu, vụn); quartz kết tinh nhiệt độ thấp → bền, hạt thạch anh bền vững trong môi trường bề mặt.</div>
 <h3>4.5. Các dạng biến đổi khoáng vật phổ biến</h3>
 <div class="card"><div data-w="pick" data-k="alter"></div></div>
 <div class="key"><b>Phản ứng thuỷ phân khái quát</b>Feldspar + H⁺ + H₂O → khoáng vật sét + ion hoà tan.<br>Sản phẩm biến đổi phụ thuộc nhiệt độ, thành phần dung dịch, pH–Eh và khoáng vật ban đầu.</div>
 <h3>4.6. Giả hình khoáng vật</h3>
 <p><b>Giả hình (pseudomorph)</b> xảy ra khi một khoáng vật mới <b>thay thế</b> khoáng vật cũ nhưng vẫn <b>giữ hình dạng bên ngoài</b> của khoáng vật ban đầu. Thành phần và cấu trúc bên trong đã đổi.</p>
 <div class="two"><div class="mini"><h4>Ví dụ: pyrite → goethite/limonite</h4>Pyrite (FeS₂) dạng lập phương bị oxy hoá và thay thế dần bởi goethite/limonite nhưng vẫn giữ hình lập phương.</div>
 <div class="mini"><h4>Ý nghĩa địa chất</h4><ol><li>Nhận biết khoáng vật có trước.</li><li>Xác định trình tự các giai đoạn biến đổi.</li><li>Suy luận điều kiện dung dịch, oxy hoá và phong hoá.</li></ol></div></div>
 <div class="tw"><table><tr><th>Phân biệt</th><th>Đặc điểm</th></tr>
 <tr><td><b>Giả hình</b></td><td>Khoáng vật mới thay khoáng vật cũ; giữ hình dạng ngoài của khoáng vật ban đầu; thành phần/cấu trúc đã đổi.</td></tr>
 <tr><td><b>Song tinh</b></td><td>Hai hoặc nhiều cá thể cùng khoáng vật; định hướng đối xứng theo quy luật; không phải quá trình thay thế thành khoáng vật khác.</td></tr>
 <tr><td><b>Biến dạng tinh thể</b></td><td>Tinh thể bị uốn, nứt hoặc méo do ứng suất; vật liệu khoáng vật vẫn là khoáng vật ban đầu; hình dạng ngoài bị biến đổi.</td></tr></table></div>
 <div class="note"><b>Mẹo nhận diện giả hình</b>So sánh hình dạng ngoài với thành phần, cấu trúc và khoáng vật còn sót lại bên trong.</div>`},

    { id: 'phan-loai', title: '15. Phân loại khoáng vật (mục 5)', html: `
 <p>Có hàng nghìn khoáng vật; nhà địa chất xếp chúng thành các <b>lớp, nhóm và loài</b> dựa trên bản chất hoá học và cấu trúc. Bài này trả lời: <b>tiêu chí nào dùng để phân loại, và các lớp khoáng vật chính là gì?</b></p>
 <h3>5.1. Nguyên tắc phân loại</h3>
 <div class="grid">
 <div class="mini"><h4>1. Thành phần hoá học</h4>Xác định các nguyên tố và tỷ lệ trong khoáng vật (quartz: SiO₂; calcite: CaCO₃).</div>
 <div class="mini"><h4>2. Nhóm anion chủ đạo</h4>Cơ sở chính để chia các lớp: SiO₄⁴⁻ → silicate; CO₃²⁻ → carbonate; SO₄²⁻ → sulfate; S²⁻ → sulfide; O²⁻/OH⁻ → oxide–hydroxide.</div>
 <div class="mini"><h4>3. Cấu trúc tinh thể</h4>Cách nguyên tố và đa diện phối trí liên kết trong không gian. Silicate: đảo → chuỗi → lớp → khung.</div>
 <div class="mini"><h4>4. Quan hệ hoá học – cấu trúc</h4>Giải thích các nhóm, chuỗi và biến thể khoáng vật: thay thế đồng hình (Mg²⁺ ⇌ Fe²⁺), đa hình (C: kim cương ⇌ graphite), dung dịch rắn (forsterite ⇌ fayalite).</div></div>
 <div class="key"><b>Công thức phân loại</b>Thành phần hoá học + nhóm anion + cấu trúc tinh thể → lớp, nhóm và loài khoáng vật.</div>
 <div class="note"><b>Ý nghĩa địa chất và kinh tế</b>Địa chất: chỉ thị môi trường thành tạo và giải thích lịch sử đá và các quá trình địa chất. Kinh tế: khoáng sản kim loại (Fe, Cu, Au…), khoáng sản công nghiệp (kaolin, thạch anh…), vật liệu xây dựng (đá vôi, granite…), khoáng sản cho công nghệ cao (đất hiếm, Li, Si…). Ý nghĩa địa chất – kinh tế là lớp ứng dụng; nền tảng phân loại vẫn là hoá học và cấu trúc.</div>
 <h3>5.2. Các lớp khoáng vật chính</h3>
 <p>Phân loại chủ yếu theo anion hoặc nhóm anion đặc trưng.</p>
 <div class="tw"><table><tr><th>Lớp</th><th>Anion / nhóm anion</th><th>Ví dụ</th></tr>
 <tr><td><b>Nguyên tố tự sinh</b></td><td>Không có anion riêng</td><td>Au, Cu, S, C</td></tr>
 <tr><td><b>Sulfide</b></td><td>S²⁻ (kim loại liên kết chủ yếu với sulfur)</td><td>Pyrite, galena, sphalerite</td></tr>
 <tr><td><b>Halide</b></td><td>Cl⁻, F⁻ (anion halogen)</td><td>Halite, fluorite</td></tr>
 <tr><td><b>Oxide và hydroxide</b></td><td>O²⁻, OH⁻ (oxygen hoặc hydroxyl là anion chính)</td><td>Hematite, magnetite, goethite</td></tr>
 <tr><td><b>Carbonate</b></td><td>CO₃²⁻</td><td>Calcite, dolomite</td></tr>
 <tr><td><b>Sulfate</b></td><td>SO₄²⁻</td><td>Gypsum, barite</td></tr>
 <tr><td><b>Phosphate</b></td><td>PO₄³⁻</td><td>Apatite</td></tr>
 <tr><td><b>Silicate</b></td><td>SiO₄⁴⁻ (cấu tạo từ các tứ diện SiO₄)</td><td>Olivine, feldspar, quartz</td></tr></table></div>
 <div class="warn"><b>Chú ý</b>Quartz có công thức SiO₂ nhưng vẫn thuộc lớp silicate, vì cấu trúc của nó được xây dựng từ các tứ diện SiO₄ liên kết thành khung.</div>
 <h3>5.3. Phân loại silicate theo cấu trúc</h3>
 <p>Silicate là lớp khoáng vật quan trọng nhất của vỏ Trái Đất. Tất cả đều dựa trên <b>tứ diện SiO₄</b>; cách các tứ diện nối với nhau (dùng chung O) cho ra các kiểu cấu trúc. Mức độ liên kết giữa các tứ diện tăng dần từ đảo đến khung, còn tỷ lệ O/Si giảm dần.</p>
 <div class="card"><h3>Các kiểu cấu trúc silicate (bấm để xem)</h3><div data-w="silicate"></div></div>
 <div class="tw"><table><tr><th>Kiểu cấu trúc</th><th>Cách liên kết</th><th>Khoáng vật tiêu biểu</th></tr>
 <tr><td>Silicate đảo</td><td>Tứ diện độc lập</td><td>Olivine, garnet</td></tr>
 <tr><td>Silicate nhóm</td><td>Hai hoặc một nhóm nhỏ tứ diện</td><td>Epidote</td></tr>
 <tr><td>Silicate vòng</td><td>Liên kết thành vòng</td><td>Beryl, tourmaline</td></tr>
 <tr><td>Silicate mạch đơn</td><td>Chuỗi đơn</td><td>Pyroxene</td></tr>
 <tr><td>Silicate mạch kép</td><td>Chuỗi kép</td><td>Amphibole</td></tr>
 <tr><td>Silicate lớp</td><td>Liên kết thành lớp</td><td>Mica, talc, khoáng vật sét</td></tr>
 <tr><td>Silicate khung</td><td>Mạng không gian ba chiều</td><td>Feldspar, quartz</td></tr></table></div>
 <h4>Liên hệ cấu trúc – tính chất (cát khai)</h4>
 <ul><li><b>Silicate lớp:</b> thường có <b>một phương</b> cát khai hoàn toàn (mica tách thành lá mỏng).</li>
 <li><b>Silicate mạch:</b> thường có <b>hai phương</b> cát khai (pyroxene ≈ 90°, amphibole 56°/124°).</li>
 <li><b>Silicate khung:</b> bền, độ cứng tương đối cao, cát khai thay đổi tuỳ khoáng vật: feldspar có hai phương cát khai; quartz không có cát khai.</li></ul>`},

    { id: 'pho-bien', title: '16. Khoáng vật phổ biến (mục 6)', html: `
 <p>Bài này tổng hợp các khoáng vật bạn gặp nhiều nhất khi học đá: nhóm silicate tạo đá và các khoáng vật không silicate (carbonate, sulfate, halide, oxide, sulfide, phosphate). Với mỗi khoáng vật, chú ý <b>tổ hợp tính chất nhận diện</b>.</p>
 <h3>6.1. Khoáng vật tạo đá silicate</h3>
 <div class="tw"><table><tr><th>Khoáng vật</th><th>Công thức / cấu trúc</th><th>Nhận diện</th><th>Nơi gặp</th></tr>
 <tr><td><b>Olivine</b></td><td>(Mg,Fe)₂SiO₄</td><td>Xanh olive; độ cứng 6,5–7; không cát khai rõ, nhiều khe nứt</td><td>Đá magma mafic và siêu mafic; dễ biến đổi thành serpentine</td></tr>
 <tr><td><b>Pyroxene</b></td><td>Silicate mạch đơn</td><td>Xanh đen hoặc đen; hai phương cát khai gần 90°; tinh thể ngắn, chắc</td><td>Phổ biến trong basalt và gabbro</td></tr>
 <tr><td><b>Amphibole</b></td><td>Silicate mạch kép</td><td>Xanh đậm hoặc đen; tinh thể dạng trụ dài; hai phương cát khai 56° và 124°</td><td>Andesite, diorite và đá biến chất</td></tr>
 <tr><td><b>Mica</b></td><td>Silicate lớp</td><td>Một phương cát khai hoàn toàn; tách thành lá mỏng đàn hồi; muscovite sáng màu, biotite nâu đến đen</td><td>Đá magma intermediate/felsic, đá biến chất</td></tr>
 <tr><td><b>Feldspar</b></td><td>K-feldspar và plagioclase</td><td>Hai phương cát khai ≈ 90°; độ cứng ≈ 6; plagioclase có song tinh đa hợp</td><td>Nhóm phổ biến nhất trong vỏ Trái Đất; biến đổi thành sericite hoặc khoáng vật sét</td></tr>
 <tr><td><b>Quartz</b></td><td>SiO₂</td><td>Độ cứng 7; không cát khai, vết vỡ vỏ sò; ánh thuỷ tinh</td><td>Đá magma felsic, biến chất, trầm tích</td></tr>
 <tr><td><b>Garnet</b></td><td>Silicate đảo</td><td>Thường tạo tinh thể đẳng thước; không có cát khai; độ cứng cao</td><td>Đặc trưng trong nhiều đá biến chất</td></tr>
 <tr><td><b>Khoáng vật sét</b></td><td>Kaolinite, illite, smectite, chlorite</td><td>Hạt rất nhỏ; diện tích bề mặt lớn; khả năng trao đổi ion khác nhau</td><td>Quan trọng trong địa chất, địa kỹ thuật và môi trường</td></tr></table></div>
 <div class="key"><b>Nhận diện nhanh</b>Hình dạng tinh thể + số phương cát khai + góc cát khai (và vết vỡ, độ cứng, kích thước hạt).</div>
 <h3>6.2. Khoáng vật không silicate</h3>
 <div class="tw"><table><tr><th>Khoáng vật</th><th>Công thức</th><th>Nhận diện</th></tr>
 <tr><td><b>Calcite</b></td><td>CaCO₃</td><td>Sủi bọt mạnh với HCl loãng; độ cứng 3; ba phương cát khai không vuông góc; khoáng vật chính của đá vôi và đá hoa</td></tr>
 <tr><td><b>Dolomite</b></td><td>CaMg(CO₃)₂</td><td>Phản ứng với HCl yếu ở dạng khối, rõ hơn khi nghiền thành bột; thành phần chính của đá dolomite</td></tr>
 <tr><td><b>Gypsum</b></td><td>CaSO₄·2H₂O</td><td>Độ cứng 2 (móng tay cào được); có thể bị mài mỏng; phổ biến trong môi trường bốc hơi</td></tr>
 <tr><td><b>Halite</b></td><td>NaCl</td><td>Ba phương cát khai vuông góc, hình khối lập phương; vị mặn; dễ hoà tan; hình thành trong môi trường bốc hơi</td></tr>
 <tr><td><b>Magnetite</b></td><td>Fe₃O₄</td><td>Từ tính mạnh; màu và vết vạch đen; quặng sắt quan trọng</td></tr>
 <tr><td><b>Goethite</b></td><td>FeO(OH)</td><td>Nâu vàng đến nâu đen; phổ biến trong đới phong hoá; thành phần quan trọng của laterite và limonite</td></tr>
 <tr><td><b>Pyrite</b></td><td>FeS₂</td><td>Vàng đồng, ánh kim; thường có tinh thể lập phương; cứng hơn chalcopyrite; oxy hoá tạo nước acid</td></tr>
 <tr><td><b>Chalcopyrite</b></td><td>CuFeS₂</td><td>Vàng đồng; mềm hơn pyrite; quặng đồng quan trọng</td></tr>
 <tr><td><b>Galena</b></td><td>PbS</td><td>Màu xám chì; ánh kim mạnh; tỷ trọng cao; ba phương cát khai vuông góc; quặng chì quan trọng</td></tr>
 <tr><td><b>Sphalerite</b></td><td>ZnS</td><td>Vàng nâu đến đen; ánh nhựa đến ánh kim cương; quặng kẽm quan trọng</td></tr>
 <tr><td><b>Apatite</b></td><td>Ca₅(PO₄)₃(F,Cl,OH)</td><td>Độ cứng Mohs = 5; khoáng vật phosphate phổ biến; nguồn nguyên liệu sản xuất phân lân</td></tr></table></div>
 <div class="note"><b>Mở rộng (giá trị chuẩn bổ sung)</b>Độ cứng Mohs thường gặp: halite ≈ 2,5; galena ≈ 2,5; chalcopyrite ≈ 3,5–4; sphalerite ≈ 3,5–4; goethite ≈ 5–5,5; magnetite ≈ 5,5–6,5; pyrite ≈ 6–6,5. Tỷ trọng: galena ≈ 7,5; magnetite ≈ 5,2; pyrite ≈ 5,0.</div>
 <h3>Tra cứu nhanh – lọc theo nhóm</h3>
 <div class="card"><div data-w="mincards"></div></div>
 <div class="note"><b>Khi cần phân biệt cặp dễ nhầm</b><br><b>Pyrite ↔ chalcopyrite:</b> cùng vàng đồng; pyrite cứng hơn, thường lập phương; chalcopyrite mềm hơn, có thể có màu óng ánh.<br><b>Calcite ↔ dolomite:</b> dùng HCl loãng: calcite sủi mạnh, dolomite yếu (nhất là dạng khối).<br><b>Pyroxene ↔ amphibole:</b> góc cát khai ≈ 90° (87°/93°) và tinh thể ngắn, chắc ↔ 56°/124° và tinh thể dạng trụ dài.<br><b>Feldspar ↔ quartz:</b> feldspar có cát khai ≈ 90°, độ cứng ≈ 6; quartz không cát khai, độ cứng 7, vết vỡ vỏ sò.</div>`},

    { id: 'quy-trinh', title: '17. Quy trình nhận biết khoáng vật (mục 7)', html: `
 <p>Nhận biết khoáng vật là kỹ năng thực hành quan trọng: bạn dùng <b>tổ hợp</b> các tính chất, đi từ quan sát đến thử nghiệm, rồi đối chiếu. Mười bước dưới đây thành một quy trình:</p>
